name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Compile Python
        run: |
          python -m compileall app bot tests

      - name: Check migrations from scratch
        env:
          DATABASE_URL: sqlite:////tmp/skillflow_ci_migrations.db
        run: |
          alembic upgrade head

      - name: Check frontend modules
        run: |
          find app/static/js -name '*.js' -print -exec node --check {} \;

      - name: Lint frontend
        run: npm run lint

      - name: Run tests
        run: pytest -q
